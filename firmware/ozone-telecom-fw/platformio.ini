; OZONE TELECOM hub firmware — ESP32-S3-MINI-1U
; Framework: Arduino-ESP32 (via PlatformIO). Chosen over raw ESP-IDF so the
; three concurrent radio stacks (WiFi/WebSocket, BLE NUS, LoRa SPI) can lean
; on small, well-maintained libraries instead of hand-rolled esp-idf glue.
; Everything still runs on the same FreeRTOS/lwIP base ESP-IDF provides
; underneath arduino-esp32 — this is not "less real" than pure IDF, just less
; boilerplate for a one-person team on a tight clock.

[env:ozone_telecom]
platform = espressif32
board = esp32-s3-devkitc-1        ; generic ESP32-S3 devkit target; swap for a
                                   ; custom board def once the telecom PCB has
                                   ; its own boards.txt entry. Module is the
                                   ; ESP32-S3-MINI-1U (N8, no PSRAM per BOM).
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; PSRAM: MINI-1U-N8 variant has NO PSRAM. Do not enable board_build.arduino.memory_type=qio_opi.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ARDUHAL_LOG_COLORS=1

lib_deps =
    jgromes/RadioLib @ ^7.1.2           ; SX1262/E22 driver — actively maintained, native SX126x support
    mikalhart/TinyGPSPlus @ ^1.1.0      ; NMEA parser for the MAX-M10S UART feed
    links2004/WebSockets @ ^2.4.1       ; WebSocket server for the WiFi fan-out link
    ; BLE (NimBLE-Arduino) is used instead of the stock arduino-esp32 BLE stack:
    ; smaller RAM footprint, better coexistence with WiFi, still exposes the
    ; same GATT server API shape we need for a Nordic UART Service (NUS).
    h2zero/NimBLE-Arduino @ ^1.4.1
